<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Oda Modu</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:#f7f7f3;color:#111;font-family:Arial,Helvetica,sans-serif}body{padding:28px 30px 32px}table{width:100%;border-collapse:collapse}
    .header{border-bottom:4px solid #111}.header td{padding-bottom:16px;vertical-align:middle}.title{font-size:31px;font-weight:bold}.sub{display:block;margin-top:5px;font-size:10px;letter-spacing:2px;color:#555}.clock{text-align:right;font-size:33px;font-weight:bold}
    .status{margin:18px 0 22px;padding:14px 17px;border:3px solid #111;background:#fff}.status td{font-size:11px;font-weight:bold}.status td:last-child{text-align:right}.status-main{font-size:18px}.muted{color:#666}
    .modes{table-layout:fixed}.modes td{width:33.33%;padding:0 7px;vertical-align:top}.modes td:first-child{padding-left:0}.modes td:last-child{padding-right:0}
    .mode{width:100%;height:330px;padding:24px 17px;border:4px solid #111;background:#fff;color:#111;font-family:Arial;text-align:left}.mode:active{background:#111;color:#fff}.number{display:block;font-size:12px;letter-spacing:2px}.icon{display:block;margin:48px 0 35px;font-size:57px;line-height:1;text-align:center}.name{display:block;font-size:25px;line-height:1.08;font-weight:bold}.detail{display:block;margin-top:17px;font-size:11px;line-height:1.5;color:#555}.mode:active .detail{color:#fff}
    .result{margin-top:22px;padding:17px;border:3px solid #111;background:#111;color:#fff;text-align:center;font-size:16px;font-weight:bold;letter-spacing:1px}.result.error{background:#fff;color:#111}
    .footer{margin-top:18px;border-top:3px solid #111}.footer td{padding-top:14px;font-size:10px;font-weight:bold}.footer td:last-child{text-align:right}.footer button{height:42px;padding:0 16px;border:3px solid #111;background:#fff;font-weight:bold}
    @media(max-width:520px){body{padding:20px}.mode{height:285px;padding:18px 12px}.name{font-size:20px}.icon{margin:38px 0 30px;font-size:48px}}
  </style>
</head>
<body>
  <table class="header"><tr><td><span class="title">Oda Modu</span><span class="sub">NASIL DEVAM EDİYORUZ?</span></td><td class="clock" id="clock">--:--</td></tr></table>
  <div class="status"><table><tr><td><span class="status-main" id="lightState">IŞIKLAR KONTROL EDİLİYOR</span></td><td><span id="lightDetail" class="muted">--</span></td></tr></table></div>
  <table class="modes"><tr>
    <td><button class="mode" onclick="choose('preset','reading','KİTAP MODU')"><span class="number">01</span><span class="icon">Aa</span><span class="name">Kitap<br>Okuyorum</span><span class="detail">Sıcak ve rahat<br>2700K · %45</span></button></td>
    <td><button class="mode" onclick="choose('power','off','UYKU MODU')"><span class="number">02</span><span class="icon">Zz</span><span class="name">Uyumaya<br>Geçiyorum</span><span class="detail">İki ışığı da<br>kapat</span></button></td>
    <td><button class="mode" onclick="choose('preset','focus','ÇALIŞMA MODU')"><span class="number">03</span><span class="icon">01</span><span class="name">Çalışmaya<br>Başlıyorum</span><span class="detail">Net ve aydınlık<br>4000K · %80</span></button></td>
  </tr></table>
  <div class="result" id="result">BİR MOD SEÇ</div>
  <table class="footer"><tr><td>15 SANİYEDE BİR DURUM KONTROLÜ</td><td><button onclick="location.href='/'">← ANA PANEL</button></td></tr></table>
  <script type="text/javascript">
    function el(id){return document.getElementById(id)}
    function clock(){var now=new Date();el('clock').innerHTML=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)}
    function render(data){var lights=data.lights||[];var reachable=0;var on=0;var dim=null;var temp=null;var mixed=false;for(var i=0;i<lights.length;i++){if(lights[i].reachable){reachable++;if(lights[i].state){on++;if(dim===null){dim=lights[i].dimming;temp=lights[i].temperature}else if(dim!==lights[i].dimming||temp!==lights[i].temperature){mixed=true}}}}if(reachable<lights.length){el('lightState').innerHTML='BAZI IŞIKLARA ULAŞILAMIYOR';el('lightDetail').innerHTML=reachable+'/'+lights.length+' ERİŞİLEBİLİR'}else if(on===0){el('lightState').innerHTML='IŞIKLAR KAPALI';el('lightDetail').innerHTML='HAZIR'}else{el('lightState').innerHTML=on+'/'+lights.length+' IŞIK AÇIK';el('lightDetail').innerHTML=mixed?'FARKLI AYARLAR':((dim||0)+'% · '+(temp||'--')+'K')}}
    function loadStatus(){var xhr=new XMLHttpRequest();xhr.open('GET','/api/lights/status?t='+new Date().getTime(),true);xhr.onreadystatechange=function(){if(xhr.readyState===4&&xhr.status>=200&&xhr.status<300){try{render(JSON.parse(xhr.responseText))}catch(error){}}};xhr.send(null)}
    function choose(action,value,label){el('result').className='result';el('result').innerHTML='UYGULANIYOR...';var xhr=new XMLHttpRequest();xhr.open('POST','/api/lights/command',true);xhr.setRequestHeader('Content-Type','application/json');xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status>=200&&xhr.status<300){try{var data=JSON.parse(xhr.responseText);el('result').innerHTML=data.ok?label+' AKTİF':'BAZI IŞIKLAR YANIT VERMEDİ';el('result').className=data.ok?'result':'result error'}catch(error){el('result').innerHTML='YANIT OKUNAMADI';el('result').className='result error'}setTimeout(loadStatus,700)}else{el('result').innerHTML='KOMUT GÖNDERİLEMEDİ';el('result').className='result error'}}};xhr.send(JSON.stringify({target:'all',action:action,value:value}))}
    clock();loadStatus();setInterval(clock,30000);setInterval(loadStatus,15000);
  </script>
</body>
</html>
